kind = "mobile"
previewPath = "/"
title = "grème"
description = "A premium, mobile-first shopping platform for browsing, saving, and purchasing fashion, beauty, home, and accessory products across web and Android with a shared Supabase backend."
version = "1.0.0"
id = "artifacts/greme"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24017

[services.development]
run = "pnpm --filter @workspace/greme run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/greme", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/greme", "run", "serve" ]

[services.env]
PORT = "24017"
BASE_PATH = "/"
